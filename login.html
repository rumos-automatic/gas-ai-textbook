<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | AI×GAS 短期講座</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    .login-card {
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn-primary {
      transition: all 0.3s ease;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- ヘッダー -->
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex items-center gap-3">
        <img src="favicon.png" alt="Logo" class="w-10 h-10">
        <h1 class="text-xl md:text-2xl font-bold text-gray-800">AI×GAS 短期講座</h1>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="login-card w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <!-- ロゴ・タイトル -->
        <div class="text-center mb-8">
          <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-800 mb-2">受講者ログイン</h2>
          <p class="text-gray-600 text-sm">
            決済時に使用したメールアドレスを入力してください
          </p>
        </div>

        <!-- ログインフォーム -->
        <form id="loginForm" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
              メールアドレス
            </label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="example@email.com"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
            >
          </div>

          <!-- エラーメッセージ -->
          <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
          </div>

          <!-- 送信ボタン -->
          <button
            type="submit"
            id="submitBtn"
            class="btn-primary w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-medium flex items-center justify-center gap-2"
          >
            <span id="btnText">ログイン</span>
            <svg id="btnSpinner" class="hidden spinner w-5 h-5" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </form>

        <!-- 補足情報 -->
        <div class="mt-6 pt-6 border-t border-gray-200">
          <p class="text-center text-gray-500 text-sm">
            講座を購入されていない方は<br>
            <a href="https://gas-ai-lp.pages.dev/" class="text-blue-600 hover:underline">こちら</a>からお申し込みください
          </p>
        </div>
      </div>

      <!-- サポート情報 -->
      <p class="text-center text-gray-500 text-xs mt-4">
        ログインできない場合は<br>
        <a href="mailto:support@example.com" class="text-blue-600 hover:underline">サポート</a>までお問い合わせください
      </p>
    </div>
  </main>

  <!-- フッター -->
  <footer class="bg-gray-100 py-4">
    <p class="text-center text-gray-500 text-sm">
      &copy; 2025 AI×GAS 短期講座
    </p>
  </footer>

  <script>
    // GAS Web App URL
    const AUTH_API_URL = 'https://script.google.com/macros/s/AKfycbzX4EGJgpsw5uCDJtpr48DCvyvrWF9vDvok9ijSGmdDefowzGzOfjeNn7JULtB0H93S/exec';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorMessage = document.getElementById('errorMessage');

    // 既にログイン済みならリダイレクト
    if (localStorage.getItem('course_auth_token')) {
      window.location.href = '/index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        showError('メールアドレスを入力してください');
        return;
      }

      // ローディング状態
      setLoading(true);
      hideError();

      try {
        const response = await fetch(AUTH_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: email }),
        });

        const data = await response.json();

        if (data.success) {
          // 認証成功
          localStorage.setItem('course_auth_token', data.token);
          localStorage.setItem('course_auth_email', email);
          localStorage.setItem('course_auth_expires', data.expiresAt);

          // コンテンツページへリダイレクト
          window.location.href = '/index.html';
        } else {
          // 認証失敗
          showError(data.message || 'ログインに失敗しました');
        }
      } catch (error) {
        console.error('Auth error:', error);
        showError('通信エラーが発生しました。しばらく経ってから再度お試しください。');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.textContent = isLoading ? '確認中...' : 'ログイン';
      btnSpinner.classList.toggle('hidden', !isLoading);
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }
  </script>
</body>
</html>
