<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/auth-guard.js"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    /* Card styles */
    .slide-card {
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
    }

    .slide-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .slide-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .slide-card:hover .card-image {
      transform: scale(1.05);
    }

    .slide-card:hover .card-overlay {
      opacity: 1;
    }

    .card-image {
      transition: transform 0.4s ease;
    }

    .card-overlay {
      opacity: 0;
      transition: opacity 0.3s ease;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.7) 0%,
        rgba(0, 0, 0, 0.3) 50%,
        transparent 100%
      );
    }

    /* Link card styles */
    .link-card {
      transition: all 0.3s ease;
    }

    .link-card:hover {
      transform: translateX(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    /* Modal styles */
    .modal-backdrop {
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      animation: modalIn 0.3s ease-out;
    }

    @keyframes modalIn {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Section number badge */
    .section-number {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      border-radius: 50%;
      font-size: 0.875rem;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }

    /* Category badge */
    .category-badge {
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #f3e8ff 0%, #fce7f3 100%);
      color: #7c3aed;
    }

    /* Download button */
    .download-btn {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
    }

    /* Fade up animation */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up {
      animation: fadeUp 0.6s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 min-h-screen">
  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-3 text-gray-600 hover:text-purple-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

      <div class="flex items-center gap-2 text-purple-600">

  </nav>

  <!-- Hero Section -->

      <!-- Title -->

  <main class="px-6 pb-24">

          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>

      <!-- Slides Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="slides-grid">

    <!-- ChatGPT Examples Section -->
    <section class="max-w-4xl mx-auto">

          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-2xl md:text-3xl font-bold text-gray-900">ChatGPT実例集</h2>
          <p class="text-sm text-gray-500">実際の会話履歴を公開</p>
        </div>
      </div>

      <!-- Links List -->
      <div class="space-y-4" id="links-list">
        <!-- Links will be generated by JavaScript -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 bg-white/50">
    <div class="max-w-6xl mx-auto px-6 py-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <p class="text-sm text-gray-500">
          &copy; 2025 AI×GAS 短期講座. All rights reserved.
        </p>
        <a href="#" class="text-sm text-gray-500 hover:text-purple-600 transition-colors flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
          </svg>
          ページ上部へ
        </a>
      </div>
    </div>
  </footer>

  <!-- Image Modal -->
  <div id="image-modal" class="fixed inset-0 z-[100] hidden">
    <div class="modal-backdrop absolute inset-0" onclick="closeModal()"></div>
    <div class="modal-content absolute inset-4 md:inset-8 flex flex-col items-center justify-center">
      <!-- Close button -->
      <button onclick="closeModal()" class="absolute top-4 right-4 md:top-8 md:right-8 w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center text-gray-600 hover:text-gray-900 hover:shadow-xl transition-all z-10">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Image container -->
      <div class="relative max-w-full max-h-[calc(100vh-200px)] overflow-hidden rounded-xl shadow-2xl bg-white">
        <img id="modal-image" src="" alt="" class="max-w-full max-h-[calc(100vh-200px)] object-contain">
      </div>

      <!-- Info bar -->
      <div class="mt-6 flex flex-col sm:flex-row items-center gap-4 bg-white rounded-xl shadow-lg px-6 py-4">
        <h3 id="modal-title" class="text-lg text-gray-900 font-medium text-center"></h3>
        <a id="modal-download" href="" download class="download-btn px-6 py-3 rounded-lg text-white font-medium flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          ダウンロード
        </a>
      </div>
    </div>
  </div>

  <script>
    // Slide data
    const slides = [
      { file: '01-ai-basics.webp', title: 'AI基礎：よくある誤解', category: 'AI基礎' },
      { file: '02-gpts-vs-projects.webp', title: 'ChatGPT：GPTsとProjectsの違い', category: 'ChatGPT' },
      { file: '03-chatgpt-map.webp', title: 'ChatGPT：GPTsとProjects間取り図', category: 'ChatGPT' },
      { file: '04-gpts-projects-usage.webp', title: 'ChatGPT：GPTsとProjectsの使い分け', category: 'ChatGPT' },
      { file: '05-project-examples.webp', title: 'ChatGPT：プロジェクト活用例', category: 'ChatGPT' },
      { file: '06-prompt-tips.webp', title: 'プロンプトのコツ', category: 'プロンプト' },
      { file: '07-function-vs-gas.webp', title: '比較：関数vsGAS詳細', category: '比較' },
      { file: '08-function-limits.webp', title: '比較：関数の限界', category: '比較' },
      { file: '09-gas-features.webp', title: 'GAS機能：できること一覧', category: 'GAS' },
      { file: '10-gas-columns.webp', title: 'GAS機能：複数列を1列に', category: 'GAS' },
      { file: '11-gas-5000rows.webp', title: 'GAS機能：5000件区切り', category: 'GAS' },
      { file: '12-triggers.webp', title: 'GAS基礎：トリガーとは', category: 'GAS' },
      { file: '13-gas-limits.webp', title: 'GAS基礎：制限事項', category: 'GAS' },
    ];

    // ChatGPT links data
    const chatgptLinks = [
      {
        title: 'レビュー削除条件確認',
        url: 'https://chatgpt.com/share/696f8588-1bf0-8000-883d-a63a4471347a',
        description: 'Amazonレビューの削除条件をChatGPTに確認した実例'
      },
      {
        title: '重複ASINの検出',
        url: 'https://chatgpt.com/share/696f85b9-bdec-8000-aabd-6729db867b69',
        description: 'スプレッドシートから重複するASINを見つけ出すGASコード作成'
      },
      {
        title: '重複ASINの検出（改良版）',
        url: 'https://chatgpt.com/share/696f8607-2120-8000-919d-3a20b696ea0a',
        description: '上記コードをさらに改良・最適化したバージョン'
      },
      {
        title: '5000行ごとに空白セル挿入',
        url: 'https://chatgpt.com/share/696f8644-9648-8000-a6bb-79c3454e7620',
        description: '大量データを分割処理するためのGASコード作成'
      },
      {
        title: '注文メールをスプレッドシートに転記',
        url: 'https://chatgpt.com/share/696f8664-8428-8000-8734-e3f6cd9c90bf',
        description: 'Gmailの注文メールを自動でスプレッドシートに記録'
      },
    ];

    // Generate slide cards
    const slidesGrid = document.getElementById('slides-grid');
    slides.forEach((slide, index) => {
      const card = document.createElement('div');
      card.className = 'slide-card bg-white rounded-xl shadow-md overflow-hidden cursor-pointer';
      card.style.transitionDelay = `${index * 0.05}s`;
      card.innerHTML = `
        <div class="relative aspect-video overflow-hidden">
          <img
            src="images/${slide.file}"
            alt="${slide.title}"
            class="card-image w-full h-full object-cover"
            loading="lazy"
          >
          <div class="card-overlay absolute inset-0 flex items-end p-4">
            <span class="text-xs font-medium px-3 py-1.5 rounded-full bg-white/90 text-gray-700 shadow-sm">
              クリックで拡大
            </span>
          </div>
        </div>
        <div class="p-4">
          <div class="flex items-start gap-3">
            <span class="section-number">${(index + 1).toString().padStart(2, '0')}</span>
            <div class="flex-1 min-w-0">
              <span class="category-badge">${slide.category}</span>
              <h3 class="text-sm font-medium text-gray-900 mt-2 leading-snug">${slide.title.split('：').pop()}</h3>
            </div>
          </div>
        </div>
      `;
      card.onclick = () => openModal(slide.file, slide.title);
      slidesGrid.appendChild(card);
    });

    // Generate ChatGPT links
    const linksList = document.getElementById('links-list');
    chatgptLinks.forEach((link, index) => {
      const card = document.createElement('a');
      card.href = link.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.className = 'link-card block bg-white rounded-xl shadow-md p-5';
      card.innerHTML = `
        <div class="flex items-start gap-4">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center flex-shrink-0 shadow-md">
            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364l2.0201-1.1685a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-medium text-gray-900">${link.title}</h3>
              <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </div>
            <p class="text-sm text-gray-500">${link.description}</p>
          </div>
        </div>
      `;
      linksList.appendChild(card);
    });

    // Modal functions
    const modal = document.getElementById('image-modal');
    const modalImage = document.getElementById('modal-image');
    const modalTitle = document.getElementById('modal-title');
    const modalDownload = document.getElementById('modal-download');

    function openModal(file, title) {
      const imagePath = `images/${file}`;
      modalImage.src = imagePath;
      modalImage.alt = title;
      modalTitle.textContent = title;
      modalDownload.href = imagePath;
      modalDownload.download = file;
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
        closeModal();
      }
    });

    // Intersection Observer for card animations
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      },
      { threshold: 0.1, rootMargin: '50px' }
    );

    document.querySelectorAll('.slide-card').forEach((card) => {
      observer.observe(card);
    });
  </script>
</body>
</html>
